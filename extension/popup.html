<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FireUp</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup"><header><h1>FireUp</h1><div class="header-actions"><button id="pause" disabled data-i18n="Pause">Pause</button><button id="options" data-i18n="Settings" data-i18n-aria="FireUp settings" data-i18n-title="Settings">Settings</button></div></header>
<div class="overview"><span id="counts" data-i18n="Loading tabs…">Loading tabs…</span><span id="auto"></span></div>
<div class="tools"><input id="search" type="search" placeholder="Find a tab or site" aria-label="Search tabs" data-i18n-placeholder="Find a tab or site" data-i18n-aria="Search tabs"><div class="filters"><label><span data-i18n="Show">Show</span><select id="filter"><option value="all" data-i18n="All tabs">All tabs</option><option value="loaded" data-i18n="Loaded">Loaded</option><option value="sleeping" data-i18n="Sleeping">Sleeping</option><option value="protected" data-i18n="Protected">Protected</option></select></label><button id="refresh" data-i18n="Refresh">Refresh</button></div></div>
<main id="tabs" class="tab-list" aria-label="Tabs" data-i18n-aria="Tabs"><p class="empty" data-i18n="Loading tabs…">Loading tabs…</p></main>
<details id="protection-menu" class="protection-menu" hidden><summary id="protection-title" data-i18n="Tab protection">Tab protection</summary><div class="protection-buttons"><button data-protect="30" data-i18n="For 30 minutes">For 30 minutes</button><button data-protect="60" data-i18n="For one hour">For one hour</button><button data-protect="permanent" data-i18n="Until removed">Until removed</button><button data-protect="none" data-i18n="Remove protection">Remove protection</button><button id="close-protection" data-i18n="Close">Close</button></div></details>
<section class="action-area" aria-label="Unload tabs" data-i18n-aria="Unload tabs"><label><span data-i18n="Unload">Unload</span><select id="scope"><option value="window" data-i18n="This window">This window</option><option value="selected" data-i18n="Selected tabs">Selected tabs</option><option value="all" data-i18n="All windows">All windows</option></select></label><div class="action-line"><button id="sleep" class="primary" disabled data-i18n="Loading…">Loading…</button><button id="cancel" hidden data-i18n="Stop">Stop</button></div><p id="scope-note" class="muted" data-i18n="Protected tabs will stay loaded.">Protected tabs will stay loaded.</p><p id="status" role="status" aria-live="polite"></p><button id="retry" hidden data-i18n="Retry">Retry</button></section>
<footer id="policy-note" data-i18n="Unsaved input may be lost. Protect editors and forms before unloading.">Unsaved input may be lost. Protect editors and forms before unloading.</footer>
<script src="i18n.js"></script><script src="ui-common.js"></script><script src="popup.js"></script></body></html>
