<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FireUp</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header class="popup-header">
    <div class="brand">
      <img src="icons/fireup.svg" alt="" width="24" height="24">
      <h1>FireUp</h1>
    </div>
    <button id="options" class="icon-button" data-i18n-aria="FireUp settings" data-i18n-title="Settings" aria-label="FireUp settings">
      <svg class="glyph" aria-hidden="true"><use href="icons/ui.svg#settings"/></svg>
      <span class="sr-only" data-i18n="Settings">Settings</span>
    </button>
  </header>
  <div class="auto-line">
    <span id="auto" data-i18n="Loading tabs…">Loading tabs…</span>
    <button id="pause" class="icon-label" type="button" disabled>
      <svg class="glyph" aria-hidden="true"><use id="pause-glyph" href="icons/ui.svg#pause"/></svg>
      <span id="pause-label" data-i18n="Pause">Pause</span>
    </button>
  </div>
  <div class="metrics">
    <p id="counts" class="sr-only" role="status" data-i18n="Loading tabs…">Loading tabs…</p>
    <div class="metric" aria-hidden="true">
      <div class="icon-label">
        <svg class="glyph"><use href="icons/ui.svg#tabs"/></svg>
        <span class="metric-label-full" data-i18n="Loaded tabs">Loaded tabs</span>
        <span class="metric-label-short" data-i18n="Loaded">Loaded</span>
      </div>
      <strong id="loaded-count">···</strong>
    </div>
    <div class="metric" aria-hidden="true">
      <div class="icon-label">
        <svg class="glyph"><use href="icons/ui.svg#moon"/></svg>
        <span class="metric-label-full" data-i18n="Sleeping tabs">Sleeping tabs</span>
        <span class="metric-label-short" data-i18n="Sleeping">Sleeping</span>
      </div>
      <strong id="sleeping-count">···</strong>
    </div>
  </div>
  <main class="popup-main">
    <details id="tab-list" class="panel-section">
      <summary><span class="icon-label"><svg class="glyph" aria-hidden="true"><use href="icons/ui.svg#list"/></svg><span data-i18n="Tab list">Tab list</span></span></summary>
      <div class="tools">
        <input id="search" type="search" placeholder="Find a tab or site" aria-label="Search tabs" data-i18n-placeholder="Find a tab or site" data-i18n-aria="Search tabs">
        <div class="filters">
          <label><span class="sr-only" data-i18n="Show">Show</span><select id="filter">
            <option value="all" data-i18n="All tabs">All tabs</option>
            <option value="loaded" data-i18n="Loaded">Loaded</option>
            <option value="sleeping" data-i18n="Sleeping">Sleeping</option>
            <option value="protected" data-i18n="Skipped by FireUp">Skipped by FireUp</option>
          </select></label>
          <button id="refresh" data-i18n="Refresh">Refresh</button>
        </div>
      </div>
      <div id="tabs" class="tab-list" role="region" aria-label="Tabs" data-i18n-aria="Tabs"><p class="empty" data-i18n="Loading tabs…">Loading tabs…</p></div>
      <details id="protection-menu" class="protection-menu" hidden>
        <summary id="protection-title" data-i18n="Tab protection">Tab protection</summary>
        <div class="protection-buttons">
          <button data-protect="30" data-i18n="For 30 minutes">For 30 minutes</button>
          <button data-protect="60" data-i18n="For one hour">For one hour</button>
          <button data-protect="permanent" data-i18n="Until removed">Until removed</button>
          <button data-protect="none" data-i18n="Remove protection">Remove protection</button>
          <button id="close-protection" data-i18n="Close">Close</button>
        </div>
      </details>
    </details>
  </main>
  <section class="action-area" aria-label="Unload tabs" data-i18n-aria="Unload tabs">
    <label class="scope-field">
      <span data-i18n="Unload scope">Unload scope</span>
      <select id="scope" disabled>
        <option value="window" data-i18n="This window">This window</option>
        <option value="search" data-i18n="Search results">Search results</option>
        <option value="selected" data-i18n="Selected tabs">Selected tabs</option>
        <option value="all" data-i18n="All windows">All windows</option>
      </select>
    </label>
    <p id="scope-note" class="muted" aria-live="polite"></p>
    <details id="candidate-preview" class="candidate-preview" hidden>
      <summary><span class="icon-label"><svg class="glyph" aria-hidden="true"><use href="icons/ui.svg#check-list"/></svg><span id="preview-label"></span></span></summary>
      <ul id="candidates"></ul>
    </details>
    <div class="action-line">
      <button id="sleep" class="primary icon-label" disabled>
        <svg class="glyph" aria-hidden="true"><use href="icons/ui.svg#moon"/></svg>
        <span id="sleep-label" data-i18n="Loading…">Loading…</span>
      </button>
      <button id="cancel" hidden data-i18n="Stop">Stop</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="retry" hidden data-i18n="Retry">Retry</button>
  </section>
  <footer data-i18n="Unsaved input may be lost. Protect editors and forms before unloading.">Unsaved input may be lost. Protect editors and forms before unloading.</footer>
  <script src="locales.generated.js"></script>
  <script src="i18n.js"></script>
  <script src="ui-common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
