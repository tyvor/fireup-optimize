<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FireUp</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup"><header><h1>FireUp</h1><div class="header-actions"><button id="pause" disabled>Приостановить</button><button id="options" aria-label="Настройки FireUp" title="Настройки">Настройки</button></div></header>
<div class="overview"><span id="counts">Получаю список вкладок…</span><span id="auto"></span></div>
<div class="tools"><input id="search" type="search" placeholder="Найти вкладку или сайт" aria-label="Поиск вкладок"><div class="filters"><label>Показать<select id="filter"><option value="all">Все вкладки</option><option value="loaded">Загруженные</option><option value="sleeping">Спящие</option><option value="protected">С защитой</option></select></label><button id="refresh">Обновить</button></div></div>
<main id="tabs" class="tab-list" aria-label="Вкладки"><p class="empty">Получаю список вкладок…</p></main>
<details id="protection-menu" class="protection-menu" hidden><summary id="protection-title">Защита вкладки</summary><div class="protection-buttons"><button data-protect="30">На 30 минут</button><button data-protect="60">На час</button><button data-protect="permanent">До снятия</button><button data-protect="none">Снять</button><button id="close-protection">Закрыть</button></div></details>
<section class="action-area" aria-label="Выгрузка вкладок"><label>Усыпить<select id="scope"><option value="window">В этом окне</option><option value="selected">Выбранные вкладки</option><option value="all">Во всех окнах</option></select></label><div class="action-line"><button id="sleep" class="primary" disabled>Получаю список…</button><button id="cancel" hidden>Остановить</button></div><p id="scope-note" class="muted">Защищённые вкладки останутся загруженными.</p><p id="status" role="status" aria-live="polite"></p><button id="retry" hidden>Повторить загрузку</button></section>
<footer id="policy-note">Несохранённый ввод может потеряться. Перед выгрузкой защитите редакторы и формы.</footer>
<script src="ui-common.js"></script><script src="popup.js"></script></body></html>
