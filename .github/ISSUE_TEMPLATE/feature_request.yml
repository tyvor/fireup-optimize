name: Feature request
description: Suggest a change to FireUp
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
  - type: markdown
    attributes:
      value: Issues are public. Do not post private URLs or account data. Reports may be written in English or Russian.
