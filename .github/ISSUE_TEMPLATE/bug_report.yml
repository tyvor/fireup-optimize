name: Bug report
description: Report a problem with FireUp
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Issues and attachments are public. Do not upload Firefox profiles, cookies, tokens, browsing history or private URLs. Redact personal information in screenshots. Reports may be written in English or Russian.
  - type: input
    id: fireup-version
    attributes:
      label: FireUp version
      description: Find the version at the bottom of FireUp's settings page.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Firefox and operating system
      placeholder: Firefox version and release channel; OS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the actions that trigger the problem. Include a domain only if you can disclose it publicly.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings and tab state
      description: Working-set size, idle timer, tab count, pinning, audio and protection. A full export is not required.
  - type: textarea
    id: evidence
    attributes:
      label: Additional details
      description: Redacted screenshot or error text. For memory issues, state where and when you measured and what changed after unloading.
