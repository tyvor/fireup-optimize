name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  logic-and-package:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run check:source
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run lint:addon
      - name: Package unsigned add-on
        shell: pwsh
        run: ./Build.ps1
